name: Bug report
description: Report a bug in zmNinjaNg
body:
  - type: markdown
    attributes:
      value: |
        Before opening, please read the [self-support guidelines](https://github.com/ZoneMinder/zmNinjaNg/blob/main/README.md#agentic-ai-you-and-me). You are free to post issues, but there is no guarantee of a response.

        If you use self-signed certificates, enable the toggle in **Settings > Connection** (mobile) or add your CA to the system trust store (desktop). Proper certificates (e.g. Let's Encrypt) are recommended.

  - type: input
    id: app-version
    attributes:
      label: zmNinjaNg version and build number
      description: |
        Shown at the bottom of the sidebar (open the menu on mobile) as `v<version> (<build>)`. Include the build number in parentheses.
      placeholder: e.g. 1.4.2 (1512)
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - macOS (desktop)
        - Windows (desktop)
        - Linux (desktop)
        - Web browser
    validations:
      required: true

  - type: input
    id: platform-version
    attributes:
      label: OS / browser version
      description: e.g. iOS 17.4, Android 14, macOS 14.5, Chrome 124
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device (optional)
      description: e.g. iPhone 15 Pro, Pixel 7, MacBook Pro M2
    validations:
      required: false

  - type: input
    id: zm-version
    attributes:
      label: ZoneMinder version
      placeholder: e.g. 1.36.34
    validations:
      required: true

  - type: input
    id: es-version
    attributes:
      label: Event Server (ES) version (optional)
      description: |
        `/usr/bin/zmeventnotification.pl --version` — leave blank if not installed.
    validations:
      required: false

  - type: input
    id: zm-detect-version
    attributes:
      label: zm_detect version (optional)
      description: |
        `/var/lib/zmeventnotification/bin/zm_detect.py --version` — leave blank if not installed.
    validations:
      required: false

  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: |
        A clear description of what the bug is.

        If you think the Event Server is part of the problem (push notifications, alarms, object detection), add its debug logs here too. See [How to debug issues](https://zmeventnotificationng.readthedocs.io/en/latest/guides/hooks_faq.html#how-to-debug-issues).
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: app-logs
    attributes:
      label: App logs (optional)
      description: |
        Set the log level to DEBUG in **Settings > General**, reproduce the bug, then attach the logs.

        - **iOS / Android**: open the **Logs** page from the menu, tap **Share**, and attach the `zmninja-ng-*.log` file. See [Sharing logs for support](https://zmninjang.readthedocs.io/en/latest/user-guide/logs.html#sharing-logs-for-support).
        - **Desktop**: open the **Logs** page, tap **Open**, and attach the `zmninja-ng.log` file. If the bug shows an error, also paste the developer console output. See [How do I open the developer console on the desktop app?](https://zmninjang.readthedocs.io/en/latest/user-guide/faq.html#how-do-i-open-the-developer-console-on-the-desktop-app).
        - **Web browser**: open the browser's developer console and paste its output.
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Drag and drop screenshots.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context (optional)
    validations:
      required: false
