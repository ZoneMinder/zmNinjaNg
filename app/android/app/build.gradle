apply plugin: 'com.android.application'

android {
    namespace "com.zoneminder.zmNinjaNG"
    compileSdk rootProject.ext.compileSdkVersion

    signingConfigs {
        release {
            // Only configure the keystore when it is provided (release builds via
            // CI secrets). Debug builds (e.g. assembleDebug in build-all) don't set
            // it; calling file('') here throws "path may not be null or empty".
            def keystorePath = System.getenv("ZMNINJA_KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("ZMNINJA_KEYSTORE_PASSWORD") ?: ''
                keyAlias System.getenv("ZMNINJA_KEY_ALIAS") ?: ''
                keyPassword System.getenv("ZMNINJA_KEY_PASSWORD") ?: ''
            }
        }
    }

    defaultConfig {
        applicationId "com.zoneminder.zmNinjaNG"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 102907
        versionName "2.4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            // proguard-android.txt, NOT the -optimize variant. The -optimize
            // file drops -dontoptimize, and R8's field optimization then deletes
            // com.getcapacitor.PluginHandle.pluginAnnotation: the release
            // mapping.txt kept only bridge/pluginClass/pluginMethods/pluginId/
            // instance, so the inlined getPluginAnnotation() returned null and
            // every Capacitor permission check NPE'd in Bridge.getPermissionStates.
            // FirebaseMessaging.requestPermissions() runs during push init at
            // startup, so 2.2.1 crashed on open for Android users.
            // Play Console's "Improve your app's memory and performance with R8
            // optimization" hint is not worth this; re-landing it needs keep
            // rules for Capacitor's reflective metadata plus a device pass.
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-ui:1.5.1"
    implementation "androidx.media3:media3-datasource:1.5.1"
    implementation "androidx.media3:media3-session:1.5.1"
    // Gemini Nano through AICore (GeminiNanoPlugin, issue #270). Beta API: it carries no
    // SLA or deprecation policy, so the version is pinned rather than ranged.
    implementation "com.google.mlkit:genai-prompt:1.0.0-beta4"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
