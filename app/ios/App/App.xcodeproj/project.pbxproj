		F1EF0254C4A4E84484CC8DE9 /* Embed llama.framework (not linked) */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
				"${BUILT_PRODUCTS_DIR}/llama.framework",
			);
			name = "Embed llama.framework (not linked)";
			outputFileListPaths = (
			);
			outputPaths = (
				"${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/llama.framework",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# llama.framework must ship in the bundle for LlamaBridge to dlopen, but the\n# app must not LINK it: anything the app links is bound by dyld at launch, and\n# llama needs Accelerate symbols that do not exist before iOS 16.4 (issue #421).\n# Xcode only embeds a package product for the target that links it, and that is\n# now LlamaBridge, so copy it in here and sign it like any embedded framework.\nset -e\nsrc=\"${BUILT_PRODUCTS_DIR}/llama.framework\"\ndst=\"${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}\"\n[ -d \"$src\" ] || { echo \"error: $src missing\"; exit 1; }\nmkdir -p \"$dst\"\nrsync -a --delete \"$src\" \"$dst/\"\nif [ -n \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" ]; then\n  codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" ${OTHER_CODE_SIGN_FLAGS:-} --preserve-metadata=identifier,entitlements,flags \"$dst/llama.framework\"\nfi\n";
		};
/* End PBXShellScriptBuildPhase section */

